<section class="card shadow-sm">
  <div class="card-body">
    <div class="d-flex justify-content-between flex-wrap gap-3 align-items-center mb-4">
      <div>
        <h1 class="h3 mb-1">Add Inventory Item</h1>
        <p class="text-muted mb-0">Capture every required detail to keep inventory accurate.</p>
      </div>
      <a routerLink="/" class="btn btn-outline-secondary">Back to list</a>
    </div>

    <div *ngIf="error()" class="alert alert-danger py-2">{{ error() }}</div>

    <form class="row g-4" [formGroup]="form" (ngSubmit)="submit()">
      <div class="col-12 col-md-6">
        <label for="location" class="form-label">Location</label>
        <select id="location" class="form-select" formControlName="locationId">
          <option [ngValue]="null">Select a location</option>
          <option *ngFor="let location of locations()" [ngValue]="location.id">
            {{ location.name }}
          </option>
        </select>
        <div class="text-danger small mt-1" *ngIf="form.get('locationId')?.touched && form.get('locationId')?.invalid">
          Location is required.
        </div>
      </div>

      <div class="col-12 col-md-6">
        <label for="name" class="form-label">Item Name</label>
        <input
          id="name"
          type="text"
          class="form-control"
          placeholder="Projector lens"
          formControlName="name"
        />
        <div class="text-danger small mt-1" *ngIf="form.get('name')?.touched && form.get('name')?.invalid">
          Name is required and must be under 200 characters.
        </div>
      </div>

      <div class="col-12 col-md-6">
        <label for="price" class="form-label">Price (GEL)</label>
        <input
          id="price"
          type="number"
          min="0.01"
          step="0.01"
          class="form-control"
          placeholder="250.00"
          formControlName="price"
        />
        <div class="text-danger small mt-1" *ngIf="form.get('price')?.touched && form.get('price')?.invalid">
          Price must be greater than 0.
        </div>
      </div>

      <div class="col-12 d-flex gap-2">
        <button class="btn btn-primary" type="submit" [disabled]="submitting()">
          <span class="spinner-border spinner-border-sm me-2" role="status" *ngIf="submitting()"></span>
          Add Item
        </button>
        <a routerLink="/" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</section>
